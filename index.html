<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生比賽及獲獎紀錄系統</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1050px;
            margin: auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        /* 表單與按鈕 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }
        .form-group label span.hint {
            font-size: 12px;
            color: #e74c3c;
            font-weight: normal;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        .form-group.checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .form-group.checkbox-group input {
            transform: scale(1.3);
            margin: 0;
            cursor: pointer;
        }
        .form-group.checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            flex: 1;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.cancel-btn {
            background-color: #95a5a6;
            display: none;
        }
        button.cancel-btn:hover {
            background-color: #7f8c8d;
        }
        button.batch-toggle-btn {
            background-color: #2ecc71;
            flex: none;
            width: auto;
        }
        button.batch-toggle-btn:hover {
            background-color: #27ae60;
        }
        button.bulk-delete-btn {
            background-color: #e74c3c;
            flex: none;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
        }
        button.bulk-delete-btn:hover {
            background-color: #c0392b;
        }
        button.export-btn {
            background-color: #8e44ad;
            flex: none;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
        }
        button.export-btn:hover {
            background-color: #9b59b6;
        }

        /* 批量輸入區塊 */
        #batchSection {
            display: none;
            background-color: #e8f8f5;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #a3e4d7;
        }
        #batchSection p {
            margin-top: 0;
            font-size: 14px;
            color: #16a085;
            line-height: 1.5;
        }

        /* 搜尋與表格 */
        .search-container {
            margin: 30px 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-controls input, .search-controls select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-controls input[type="text"] {
            width: 200px;
        }
        .search-controls input[type="date"] {
            cursor: pointer;
        }
        
        .date-filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #eef2f5;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .no-records {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .action-btns {
            display: flex;
            gap: 5px;
        }
        .edit-btn {
            background-color: #f39c12;
            padding: 6px 10px;
            font-size: 12px;
            flex: none;
        }
        .edit-btn:hover { background-color: #d68910; }
        .delete-btn {
            background-color: #e74c3c;
            padding: 6px 10px;
            font-size: 12px;
            flex: none;
        }
        .delete-btn:hover { background-color: #c0392b; }
        .date-info {
            font-size: 12px;
            color: #7f8c8d;
        }
        input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .status-yes { background-color: #2ecc71; }
        .status-no { background-color: #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <h1>學生比賽及獲獎紀錄系統</h1>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <button type="button" class="batch-toggle-btn" onclick="toggleBatchSection()">切換批量輸入模式 (Excel貼上)</button>
    </div>

    <!-- 批量輸入區塊 -->
    <div id="batchSection">
        <div class="form-group">
            <label>批量輸入資料 (從 Excel 複製貼上)</label>
            <p>請確保欄位順序為：<br><strong>學生姓名、班別、學號、比賽範疇、舉辦機構、比賽名稱、獲獎紀錄、負責老師、已校內頒獎(是/否)</strong>。(直接從 Excel 複製整段表格貼上即可)</p>
            <textarea id="batchData" rows="6" placeholder="陳大文	六甲	20230101	學術 (中文)	教育局	校際寫作比賽	冠軍	王老師	是..."></textarea>
        </div>
        <div class="button-group" style="margin-top: 10px; margin-bottom: 0;">
            <button type="button" style="background-color: #1abc9c;" onclick="processBatchInput()">確認批量匯入</button>
        </div>
    </div>

    <!-- 單筆資料輸入表單 -->
    <form id="recordForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="studentName">學生姓名 * <span class="hint">(請以中文輸入)</span></label>
                <input type="text" id="studentName" required placeholder="例如：陳小明">
            </div>
            <div class="form-group">
                <label for="studentClass">班別 * <span class="hint">(請以中文輸入)</span></label>
                <input type="text" id="studentClass" required placeholder="例如：六甲">
            </div>
            <div class="form-group">
                <label for="studentId">學號 *</label>
                <input type="text" id="studentId" required placeholder="例如：20230101">
            </div>
            <div class="form-group">
                <label for="category">比賽範疇 *</label>
                <select id="category" required>
                    <option value="">請選擇...</option>
                    <option value="學術 (中文)">學術 (中文)</option>
                    <option value="學術 (英文)">學術 (英文)</option>
                    <option value="學術 (數學)">學術 (數學)</option>
                    <option value="學術 (常識)">學術 (常識)</option>
                    <option value="藝術">藝術</option>
                    <option value="音樂">音樂</option>
                    <option value="體育">體育</option>
                    <option value="STEAM與資訊科技">STEAM與資訊科技</option>
                    <option value="制服團隊/服務">制服團隊/服務</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="organizer">舉辦機構 *</label>
                <input type="text" id="organizer" required placeholder="例如：教育局 / 香港學界體育聯會">
            </div>
            <div class="form-group full-width">
                <label for="competitionName">比賽名稱 *</label>
                <input type="text" id="competitionName" required placeholder="例如：全港小學數學比賽">
            </div>
            <div class="form-group">
                <label for="award">獲獎紀錄 (如有才填寫)</label>
                <input type="text" id="award" placeholder="例如：冠軍 / 金獎 / 參與證書">
            </div>
            <div class="form-group">
                <label for="teacherInCharge">負責輸入老師 *</label>
                <input type="text" id="teacherInCharge" required placeholder="例如：王大文老師">
            </div>

            <!-- 校內頒獎勾選 -->
            <div class="form-group checkbox-group full-width">
                <input type="checkbox" id="awardedInSchool">
                <label for="awardedInSchool"><strong>已於校內頒獎</strong> (勾選代表已在早會或其他場合頒發獎項)</label>
            </div>
        </div>
        <div class="button-group">
            <button type="submit" id="submitBtn">新增單筆紀錄</button>
            <button type="button" class="cancel-btn" id="cancelEditBtn" onclick="cancelEdit()">取消修改</button>
        </div>
    </form>

    <!-- 搜尋與資料列表 -->
    <div class="search-container">
        <h2>紀錄列表</h2>
        <div class="search-controls">
            <button type="button" class="bulk-delete-btn" onclick="deleteSelected()">刪除已選取</button>
            <button type="button" class="export-btn" onclick="exportToCSV()">匯出資料 (CSV)</button>

            <!-- 單一/範圍日期搜尋 -->
            <div class="date-filter-group">
                <select id="dateMode" onchange="toggleDateMode(); filterRecords()">
                    <option value="single">單一日期</option>
                    <option value="range">日期範圍</option>
                </select>
                
                <span id="singleDateContainer">
                    <input type="date" id="singleDate" onchange="filterRecords()">
                </span>
                
                <span id="rangeDateContainer" style="display:none;">
                    <input type="date" id="startDate" onchange="filterRecords()">
                    <span>至</span>
                    <input type="date" id="endDate" onchange="filterRecords()">
                </span>
            </div>

            <!-- 比賽範疇下拉式篩選 -->
            <select id="categoryFilter" onchange="filterRecords()">
                <option value="">所有範疇</option>
                <option value="學術 (中文)">學術 (中文)</option>
                <option value="學術 (英文)">學術 (英文)</option>
                <option value="學術 (數學)">學術 (數學)</option>
                <option value="學術 (常識)">學術 (常識)</option>
                <option value="藝術">藝術</option>
                <option value="音樂">音樂</option>
                <option value="體育">體育</option>
                <option value="STEAM與資訊科技">STEAM與資訊科技</option>
                <option value="制服團隊/服務">制服團隊/服務</option>
                <option value="其他">其他</option>
            </select>

            <input type="text" id="searchInput" placeholder="搜尋姓名、學號或名稱..." onkeyup="filterRecords()">
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table id="recordsTable">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                    <th>姓名</th>
                    <th>班別</th>
                    <th>學號</th>
                    <th>比賽範疇</th>
                    <th>舉辦機構</th>
                    <th>比賽名稱</th>
                    <th>獲獎紀錄</th>
                    <th>校內頒獎</th>
                    <th>負責老師</th>
                    <th>輸入/修改時間</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 紀錄將透過 JavaScript 動態生成於此 -->
            </tbody>
        </table>
        <div id="noDataMessage" class="no-records" style="display: none;">
            目前沒有符合的紀錄。
        </div>
    </div>
</div>

<script>
    // 初始化時從 LocalStorage 讀取資料
    let records = JSON.parse(localStorage.getItem('studentRecords')) || [];
    let editingId = null; 

    // 取得當下時間格式
    function getCurrentDateTime() {
        return new Date().toLocaleString('zh-HK', { hour12: false });
    }

    // 將紀錄中的字串日期解析為 Date 物件，方便範圍比對
    function parseRecordDate(dateString) {
        if (!dateString) return null;
        // 擷取所有數字 (應對不同的瀏覽器格式 yyyy/mm/dd 或 dd/mm/yyyy)
        const parts = dateString.match(/(\d+)/g);
        if (!parts || parts.length < 3) return null;
        
        let year, month, day;
        if (parseInt(parts[0]) > 1000) { 
            // 格式為 YYYY/MM/DD
            year = parseInt(parts[0]);
            month = parseInt(parts[1]) - 1;
            day = parseInt(parts[2]);
        } else if (parseInt(parts[2]) > 1000) { 
            // 格式為 DD/MM/YYYY
            day = parseInt(parts[0]);
            month = parseInt(parts[1]) - 1;
            year = parseInt(parts[2]);
        } else {
            return null;
        }
        return new Date(year, month, day);
    }

    // 切換單一/範圍日期顯示模式
    function toggleDateMode() {
        const mode = document.getElementById('dateMode').value;
        if (mode === 'single') {
            document.getElementById('singleDateContainer').style.display = 'inline-block';
            document.getElementById('rangeDateContainer').style.display = 'none';
        } else {
            document.getElementById('singleDateContainer').style.display = 'none';
            document.getElementById('rangeDateContainer').style.display = 'inline-block';
        }
    }

    // 表單提交事件 (包含新增與修改)
    document.getElementById('recordForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const recordData = {
            studentName: document.getElementById('studentName').value.trim(),
            studentClass: document.getElementById('studentClass').value.trim(),
            studentId: document.getElementById('studentId').value.trim(),
            category: document.getElementById('category').value,
            organizer: document.getElementById('organizer').value.trim(),
            competitionName: document.getElementById('competitionName').value.trim(),
            award: document.getElementById('award').value.trim(),
            teacherInCharge: document.getElementById('teacherInCharge').value.trim(),
            awardedInSchool: document.getElementById('awardedInSchool').checked
        };

        if (editingId) {
            const index = records.findIndex(r => r.id === editingId);
            if (index !== -1) {
                records[index] = { 
                    ...records[index], 
                    ...recordData,
                    dateUpdated: getCurrentDateTime() 
                };
            }
            alert('紀錄已成功更新！');
            cancelEdit(); 
        } else {
            const newRecord = {
                id: Date.now(), 
                ...recordData,
                dateAdded: getCurrentDateTime(),
                dateUpdated: null 
            };
            records.unshift(newRecord); 
            alert('單筆紀錄已成功新增！');
            this.reset();
        }

        saveAndRender();
    });

    // 切換批量輸入區塊
    function toggleBatchSection() {
        const section = document.getElementById('batchSection');
        if (section.style.display === 'none' || section.style.display === '') {
            section.style.display = 'block';
            document.getElementById('recordForm').style.display = 'none';
        } else {
            section.style.display = 'none';
            document.getElementById('recordForm').style.display = 'block';
        }
    }

    // 處理批量輸入
    function processBatchInput() {
        const rawData = document.getElementById('batchData').value;
        const lines = rawData.split('\n');
        let addedCount = 0;

        for (let line of lines) {
            if (!line.trim()) continue; 

            let cols = line.split('\t');
            if (cols.length < 8) {
                cols = line.split(','); 
            }

            if (cols.length >= 8) {
                const isAwarded = (cols[8] && (cols[8].trim() === '是' || cols[8].trim() === 'Y' || cols[8].trim() === 'true')) ? true : false;

                records.unshift({
                    id: Date.now() + Math.random(), 
                    studentName: cols[0].trim(),
                    studentClass: cols[1].trim(),
                    studentId: cols[2].trim(),
                    category: cols[3].trim(),
                    organizer: cols[4].trim(),
                    competitionName: cols[5].trim(),
                    award: cols[6].trim(),
                    teacherInCharge: cols[7].trim(),
                    awardedInSchool: isAwarded,
                    dateAdded: getCurrentDateTime(),
                    dateUpdated: null
                });
                addedCount++;
            }
        }

        if (addedCount > 0) {
            saveAndRender();
            alert(`成功批量匯入 ${addedCount} 筆紀錄！`);
            document.getElementById('batchData').value = '';
            toggleBatchSection(); 
        } else {
            alert('匯入失敗。請檢查資料格式是否正確。');
        }
    }

    function editRecord(id) {
        const record = records.find(r => r.id === id);
        if (!record) return;

        document.getElementById('batchSection').style.display = 'none';
        document.getElementById('recordForm').style.display = 'block';

        document.getElementById('studentName').value = record.studentName;
        document.getElementById('studentClass').value = record.studentClass;
        document.getElementById('studentId').value = record.studentId;
        document.getElementById('category').value = record.category;
        document.getElementById('organizer').value = record.organizer;
        document.getElementById('competitionName').value = record.competitionName;
        document.getElementById('award').value = record.award || '';
        document.getElementById('teacherInCharge').value = record.teacherInCharge;
        document.getElementById('awardedInSchool').checked = record.awardedInSchool || false;

        editingId = id;
        document.getElementById('submitBtn').textContent = '更新紀錄';
        document.getElementById('submitBtn').style.backgroundColor = '#f39c12';
        document.getElementById('cancelEditBtn').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('recordForm').reset();
        document.getElementById('submitBtn').textContent = '新增單筆紀錄';
        document.getElementById('submitBtn').style.backgroundColor = '#3498db';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function deleteRecord(id) {
        if (confirm('確定要刪除這筆紀錄嗎？此動作無法復原。')) {
            records = records.filter(r => r.id !== id);
            saveAndRender();
        }
    }

    function toggleSelectAll() {
        const selectAllCheckbox = document.getElementById('selectAll');
        const checkboxes = document.querySelectorAll('.record-checkbox');
        checkboxes.forEach(cb => {
            cb.checked = selectAllCheckbox.checked;
        });
    }

    function deleteSelected() {
        const selectedCheckboxes = document.querySelectorAll('.record-checkbox:checked');
        if (selectedCheckboxes.length === 0) {
            alert('請先在列表中勾選要刪除的紀錄。');
            return;
        }

        if (confirm(`確定要刪除已選取的 ${selectedCheckboxes.length} 筆紀錄嗎？`)) {
            const selectedIds = Array.from(selectedCheckboxes).map(cb => Number(cb.value));
            records = records.filter(r => !selectedIds.includes(r.id));
            document.getElementById('selectAll').checked = false;
            saveAndRender();
        }
    }

    // 取得目前條件下篩選出的資料 (共用於列表渲染與匯出)
    function getFilteredRecords() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const categoryFilterValue = document.getElementById('categoryFilter').value;
        
        const dateMode = document.getElementById('dateMode').value;
        const singleDateVal = document.getElementById('singleDate').value;
        const startDateVal = document.getElementById('startDate').value;
        const endDateVal = document.getElementById('endDate').value;

        return records.filter(record => {
            // 文字搜尋配對
            const matchText = 
                (record.studentName && record.studentName.toLowerCase().includes(searchTerm)) || 
                (record.studentId && record.studentId.toLowerCase().includes(searchTerm)) ||
                (record.competitionName && record.competitionName.toLowerCase().includes(searchTerm)) ||
                (record.category && record.category.toLowerCase().includes(searchTerm));

            // 下拉選單配對
            const matchCategory = (categoryFilterValue === "") || (record.category === categoryFilterValue);

            // 處理日期比對邏輯
            let matchDate = true;
            const recordDateStr = record.dateUpdated || record.dateAdded;
            const recordDate = parseRecordDate(recordDateStr);

            if (dateMode === 'single' && singleDateVal) {
                if (recordDate) {
                    const searchDate = new Date(singleDateVal);
                    matchDate = (recordDate.getFullYear() === searchDate.getFullYear() && 
                                 recordDate.getMonth() === searchDate.getMonth() && 
                                 recordDate.getDate() === searchDate.getDate());
                } else {
                    matchDate = false;
                }
            } else if (dateMode === 'range' && (startDateVal || endDateVal)) {
                if (recordDate) {
                    const sDate = startDateVal ? new Date(startDateVal) : null;
                    const eDate = endDateVal ? new Date(endDateVal) : null;
                    
                    if (sDate) sDate.setHours(0, 0, 0, 0);
                    if (eDate) eDate.setHours(23, 59, 59, 999); // 包涵當天結束前
                    
                    if (sDate && eDate) {
                        matchDate = (recordDate >= sDate && recordDate <= eDate);
                    } else if (sDate) {
                        matchDate = (recordDate >= sDate);
                    } else if (eDate) {
                        matchDate = (recordDate <= eDate);
                    }
                } else {
                    matchDate = false;
                }
            }

            return matchText && matchCategory && matchDate;
        });
    }

    function filterRecords() {
        const filtered = getFilteredRecords();
        document.getElementById('selectAll').checked = false;
        renderTable(filtered);
    }

    // 匯出資料為 CSV (支援揀選後匯出 或 條件篩選後匯出)
    function exportToCSV() {
        if (records.length === 0) {
            alert('目前沒有資料可以匯出。');
            return;
        }

        let dataToExport = [];
        const selectedCheckboxes = document.querySelectorAll('.record-checkbox:checked');

        if (selectedCheckboxes.length > 0) {
            // 有勾選時，只匯出勾選的項目
            const selectedIds = Array.from(selectedCheckboxes).map(cb => Number(cb.value));
            dataToExport = records.filter(r => selectedIds.includes(r.id));
        } else {
            // 沒勾選時，詢問是否匯出目前的篩選結果
            const confirmExport = confirm('您目前沒有勾選任何紀錄。\n\n按下「確定」將匯出目前畫面上的篩選紀錄。\n按下「取消」則返回。');
            if (!confirmExport) return;
            
            dataToExport = getFilteredRecords();
        }

        if (dataToExport.length === 0) {
            alert('沒有符合的資料可以匯出。');
            return;
        }

        let csvContent = "學生姓名,班別,學號,比賽範疇,舉辦機構,比賽名稱,獲獎紀錄,校內頒獎,負責輸入老師,新增時間,最後修改時間\n";

        dataToExport.forEach(r => {
            let row = [
                `"${r.studentName || ''}"`,
                `"${r.studentClass || ''}"`,
                `"${r.studentId || ''}"`,
                `"${r.category || ''}"`,
                `"${r.organizer || ''}"`,
                `"${r.competitionName || ''}"`,
                `"${r.award || ''}"`,
                `"${r.awardedInSchool ? '是' : '否'}"`,
                `"${r.teacherInCharge || ''}"`,
                `"${r.dateAdded || ''}"`,
                `"${r.dateUpdated || ''}"`
            ];
            csvContent += row.join(",") + "\n";
        });

        // 加上 BOM 確保 Excel 顯示中文
        const bom = "\uFEFF";
        const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "student_records.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function saveAndRender() {
        localStorage.setItem('studentRecords', JSON.stringify(records));
        filterRecords(); 
    }

    function renderTable(dataToRender = records) {
        const tbody = document.getElementById('tableBody');
        const noDataMessage = document.getElementById('noDataMessage');
        tbody.innerHTML = '';

        if (dataToRender.length === 0) {
            noDataMessage.style.display = 'block';
            document.getElementById('recordsTable').style.display = 'none';
            return;
        }

        noDataMessage.style.display = 'none';
        document.getElementById('recordsTable').style.display = 'table';

        dataToRender.forEach(record => {
            const displayDate = record.dateUpdated 
                ? `<span class="date-info">修改於:<br>${record.dateUpdated}</span>`
                : `<span class="date-info">新增於:<br>${record.dateAdded}</span>`;

            const awardStatus = record.awardedInSchool 
                ? `<span class="status-badge status-yes">是</span>`
                : `<span class="status-badge status-no">否</span>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="record-checkbox" value="${record.id}"></td>
                <td>${escapeHTML(record.studentName)}</td>
                <td>${escapeHTML(record.studentClass)}</td>
                <td>${escapeHTML(record.studentId)}</td>
                <td>${escapeHTML(record.category)}</td>
                <td>${escapeHTML(record.organizer)}</td>
                <td>${escapeHTML(record.competitionName)}</td>
                <td><strong style="color: #e67e22;">${escapeHTML(record.award || '-')}</strong></td>
                <td>${awardStatus}</td>
                <td>${escapeHTML(record.teacherInCharge)}</td>
                <td>${displayDate}</td>
                <td class="action-btns">
                    <button class="edit-btn" onclick="editRecord(${record.id})">修改</button>
                    <button class="delete-btn" onclick="deleteRecord(${record.id})">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 防止 XSS 攻擊
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    window.onload = () => {
        renderTable();
    };
</script>

</body>
</html>
